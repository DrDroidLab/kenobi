version: '3.9'

services:

  cache:
    image: 'redis:alpine'
    ports:
      - '6379:6379'
    networks:
      - mynetwork

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: prototype:latest
    container_name: backend_server
    command: ./start-server.sh
    ports:
      - 8080:8080
    environment:
      - "DJANGO_SETTINGS_MODULE=prototype.base_settings"
      - "DJANGO_DEBUG=True"
      - "DJANGO_CSRF_TRUSTED_ORIGINS=http://127.0.0.1:8080"
      - "CELERY_BROKER_URL=redis://cache:6379/0"
      - "CELERY_RESULT_BACKEND=redis://cache:6379/0"
      - "REDIS_URL=redis://cache:6379/0"
      - "CACHE_BACKEND=redis"
      - "POSTGRES_HOST=linkmoneydb.postgres.database.azure.com"
      - "POSTGRES_USER=linkmoneypg"
      - "POSTGRES_DB=postgres"
      - "POSTGRES_PASSWORD=pzD66WRQ3iH46Tx"
      - "REPLICA1_POSTGRES_HOST=linkmoneydb.postgres.database.azure.com"
      - "KAFKA_BOOTSTRAP_SERVERS=kafka:29092"
      - "KAFKA_PRODUCER_RAW_EVENT_ENABLED=1"
      - "KAFKA_PRODUCER_PROCESSED_EVENT_ENABLED=1"
      - "KAFKA_PRODUCER_RAW_MONITOR_TRANSACTION_ENABLED=1"
    depends_on:
      - cache
      - init-kafka
    networks:
      - mynetwork

  zookeeper:
    image: confluentinc/cp-zookeeper:6.1.1
    platform: linux/amd64
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - mynetwork

  kafka:
    image: confluentinc/cp-kafka:6.1.1
    platform: linux/amd64
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
    expose:
      - '29092'
    environment:
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_MIN_INSYNC_REPLICAS: '1'
    networks:
      - mynetwork

  init-kafka:
    image: confluentinc/cp-kafka:6.1.1
    platform: linux/amd64
    depends_on:
      - kafka
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      # blocks until kafka is reachable
      kafka-topics --bootstrap-server kafka:29092 --list

      echo -e 'Creating kafka topics'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic raw-events --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic raw-monitor-transactions --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic processed-events --replication-factor 1 --partitions 1

      echo -e 'Successfully created the following topics:'
      kafka-topics --bootstrap-server kafka:29092 --list
      "
    networks:
      - mynetwork

  raw-events-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    image: prototype:latest
    command: ./start-kafka-consumer.sh
    environment:
      - "DJANGO_SETTINGS_MODULE=prototype.base_settings"
      - "DJANGO_DEBUG=True"
      - "DJANGO_CSRF_TRUSTED_ORIGINS=http://127.0.0.1:8080"
      - "CELERY_BROKER_URL=redis://cache:6379/0"
      - "CELERY_RESULT_BACKEND=redis://cache:6379/0"
      - "REDIS_URL=redis://cache:6379/0"
      - "CACHE_BACKEND=redis"
      - "POSTGRES_HOST=linkmoneydb.postgres.database.azure.com"
      - "POSTGRES_USER=linkmoneypg"
      - "POSTGRES_DB=postgres"
      - "POSTGRES_PASSWORD=pzD66WRQ3iH46Tx"
      - "REPLICA1_POSTGRES_HOST=linkmoneydb.postgres.database.azure.com"
      - "KAFKA_BOOTSTRAP_SERVERS=kafka:29092"
      - "KAFKA_CONSUMER=raw_events"
      - "KAFKA_CONSUMER_GROUP=raw_events_consumer_group"
      - "KAFKA_PRODUCER_RAW_EVENT_ENABLED=1"
      - "KAFKA_PRODUCER_PROCESSED_EVENT_ENABLED=1"
      - "KAFKA_PRODUCER_RAW_MONITOR_TRANSACTION_ENABLED=1"
    depends_on:
      - cache
      - kafka
      - init-kafka
    networks:
      - mynetwork

  raw-monitor-transactions-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    image: prototype:latest
    command: ./start-kafka-consumer.sh
    environment:
      - "DJANGO_SETTINGS_MODULE=prototype.base_settings"
      - "DJANGO_DEBUG=True"
      - "DJANGO_CSRF_TRUSTED_ORIGINS=http://127.0.0.1:8080"
      - "CELERY_BROKER_URL=redis://cache:6379/0"
      - "CELERY_RESULT_BACKEND=redis://cache:6379/0"
      - "REDIS_URL=redis://cache:6379/0"
      - "CACHE_BACKEND=redis"
      - "POSTGRES_HOST=linkmoneydb.postgres.database.azure.com"
      - "POSTGRES_USER=linkmoneypg"
      - "POSTGRES_DB=postgres"
      - "POSTGRES_PASSWORD=pzD66WRQ3iH46Tx"
      - "REPLICA1_POSTGRES_HOST=linkmoneydb.postgres.database.azure.com"
      - "KAFKA_BOOTSTRAP_SERVERS=kafka:29092"
      - "KAFKA_CONSUMER=raw_monitor_transactions"
      - "KAFKA_CONSUMER_GROUP=raw_monitor_transactions_consumer_group"
      - "KAFKA_PRODUCER_RAW_EVENT_ENABLED=1"
      - "KAFKA_PRODUCER_PROCESSED_EVENT_ENABLED=1"
      - "KAFKA_PRODUCER_RAW_MONITOR_TRANSACTION_ENABLED=1"
    depends_on:
      - cache
      - kafka
      - init-kafka
    networks:
      - mynetwork

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: prototype:latest
    command: ./start-celery-beat.sh
    environment:
      - "DJANGO_SETTINGS_MODULE=prototype.base_settings"
      - "DJANGO_DEBUG=True"
      - "DJANGO_CSRF_TRUSTED_ORIGINS=http://127.0.0.1:8080"
      - "CELERY_BROKER_URL=redis://cache:6379/0"
      - "CELERY_RESULT_BACKEND=redis://cache:6379/0"
      - "REDIS_URL=redis://cache:6379/0"
      - "CACHE_BACKEND=redis"
      - "POSTGRES_HOST=linkmoneydb.postgres.database.azure.com"
      - "POSTGRES_USER=linkmoneypg"
      - "POSTGRES_DB=postgres"
      - "POSTGRES_PASSWORD=pzD66WRQ3iH46Tx"
      - "REPLICA1_POSTGRES_HOST=linkmoneydb.postgres.database.azure.com"
      - "KAFKA_BOOTSTRAP_SERVERS=kafka:29092"
    depends_on:
      - cache
    networks:
      - mynetwork

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: prototype:latest
    command: ./start-celery-worker.sh
    environment:
      - "DJANGO_SETTINGS_MODULE=prototype.base_settings"
      - "DJANGO_DEBUG=True"
      - "DJANGO_CSRF_TRUSTED_ORIGINS=http://127.0.0.1:8080"
      - "CELERY_BROKER_URL=redis://cache:6379/0"
      - "CELERY_RESULT_BACKEND=redis://cache:6379/0"
      - "REDIS_URL=redis://cache:6379/0"
      - "CACHE_BACKEND=redis"
      - "POSTGRES_HOST=linkmoneydb.postgres.database.azure.com"
      - "POSTGRES_USER=linkmoneypg"
      - "POSTGRES_DB=postgres"
      - "POSTGRES_PASSWORD=pzD66WRQ3iH46Tx"
      - "REPLICA1_POSTGRES_HOST=linkmoneydb.postgres.database.azure.com"
      - "KAFKA_BOOTSTRAP_SERVERS=kafka:29092"
    depends_on:
      - cache
    networks:
      - mynetwork

  webvault:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: webvault:latest
    ports:
      - '80:80'
    depends_on:
      - server
    networks:
      - mynetwork

networks:
  mynetwork:

volumes:
  postgres_data: